services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./runts.db:/app/runts.db:ro
      - ./attachments:/app/attachments:ro
    environment:
      - DB_PATH=/app/runts.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
