services:
  web:
    image: ghcr.io/piccioli/runts:develop
    ports:
      - "8000:8000"
    volumes:
      - /opt/runts/runts.db:/app/runts.db:ro
      - /opt/runts/attachments:/app/attachments:ro
    environment:
      - DB_PATH=/app/runts.db
      - ENV=uat
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
