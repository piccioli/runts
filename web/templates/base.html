<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RUNTS — Sezioni CAI{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .table th { white-space: nowrap; }
    .leaflet-container img { max-width: none !important; max-height: none !important; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4 sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/">RUNTS · Sezioni CAI</a>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
  <footer class="footer fixed-bottom bg-dark text-white py-2">
    <div class="container text-center small">
      Montagna Servizi S.C.P.A. &mdash; Via Errico Petrella 19, 20124 Milano &mdash; montagnaservizi.com
    </div>
  </footer>
</body>
</html>
