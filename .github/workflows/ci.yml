name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt -r web/requirements.txt -r requirements-dev.txt
          mkdir -p .venv/bin && ln -s "$(which python3)" .venv/bin/python3
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Run pytest
        run: pytest scraper/test_sede_legale.py scraper/test_upsert.py -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t runts:test .
      - name: Verify image starts
        run: docker run --rm runts:test python -c 'import uvicorn; print("ok")'
