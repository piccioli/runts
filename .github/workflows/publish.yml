name: Publish

on:
  push:
    branches:
      - develop
      - prod

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "tags=ghcr.io/piccioli/runts:latest,ghcr.io/piccioli/runts:v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/piccioli/runts:develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
